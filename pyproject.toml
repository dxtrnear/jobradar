[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobradar"
version = "0.1.0"
description = "Local tool that collects, deduplicates and ranks job/PhD offers, exposed to Claude via MCP."
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["jobradar"]
